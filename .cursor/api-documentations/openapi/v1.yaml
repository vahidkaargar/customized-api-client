        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: disableMfa
      summary: Disable MFA for the authenticated user
      description: |
        Idempotent **204**: repeats after MFA is already off (including when no enrollment exists) do not error.
        Pending enrollment (not yet confirmed) is cleared while recovery codes remain; once demoted to inactive with no codes, further calls no-op.
      tags: [Security]
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        '204':
          description: MFA disabled.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '428':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me/security/mfa/enroll:
    post:
      operationId: enrollMfa
      summary: Begin MFA enrollment
      tags: [Security]
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [type, attributes]
                  properties:
                    type: { type: string, enum: [mfa-enrollments] }
                    attributes:
                      type: object
                      properties:
                        factor: { type: string, enum: [totp] }
      responses:
        '201':
          description: Enrollment initiated, provisioning URI returned.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me/security/mfa/confirm:
    post:
      operationId: confirmMfa
      summary: Confirm MFA enrollment with a TOTP code
      tags: [Security]
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [type, attributes]
                  properties:
                    type: { type: string, enum: [mfa-confirmations] }
                    attributes:
                      type: object
                      required: [code]
                      properties:
                        code:
                          type: string
                          pattern: '^\d{6}$'
      responses:
        '200':
          description: MFA confirmed.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me/security/mfa/challenges:
    post:
      operationId: beginMfaChallenge
      summary: Begin MFA step-up challenge for an active enrollment
      description: >
        Canonical HTTP entry for PAT step-up challenges. There is no duplicate
        begin/verify path under `/auth/*`; clients use this operation with
        `verifyMfaChallenge` on `/me/security/mfa/challenges/{challenge}/verify`.
      tags: [Security]
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type: { type: string, enum: [mfa-challenges] }
      responses:
        '201':
          description: MFA challenge created; verify via challenges verify route.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '428':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me/security/mfa/challenges/{challenge}/verify:
    post:
      operationId: verifyMfaChallenge
      summary: Verify a two-factor MFA challenge
      tags: [Security]
      security:
        - sanctum: []
      parameters:
        - name: challenge
          in: path
          required: true
          description: The MFA challenge ULID identifier.
          schema:
            type: string
            format: ulid
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [type, attributes]
                  properties:
                    type:
                      type: string
                      enum: [mfa-challenges]
                    attributes:
                      type: object
                      required: [code]
                      properties:
                        code:
                          type: string
                          description: The TOTP or recovery code to verify.
      responses:
        '200':
          description: Challenge verified successfully.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [type, id, attributes]
                    properties:
                      type:
                        type: string
                        enum: [mfa-challenges]
                      id:
                        type: string
                        format: ulid
                      attributes:
                        type: object
                        required: [verified]
                        properties:
                          verified:
                            type: boolean
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me/security/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: Regenerate MFA recovery codes
      tags: [Security]
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Recovery codes regenerated.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '428':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/security/ip-blocks:
    post:
      operationId: blockIp
      summary: Block an IP address
      tags: [Security]
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [type, attributes]
                  properties:
                    type: { type: string, enum: [ip-blocks] }
                    attributes:
                      type: object
                      required: [ip, reason]
                      properties:
                        ip:
                          type: string
                          format: ipv4
                        reason:
                          type: string
                          maxLength: 500
      responses:
        '201':
          description: IP blocked.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/security/ip-blocks/{ip}:
    delete:
      operationId: unblockIp
      summary: Unblock an IP address
      tags: [Security]
      security:
        - sanctum: []
      parameters:
        - in: path
          name: ip
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        '204':
          description: IP unblocked.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '428':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ── User Profile — Profile, Username, Phone ───────────────────────────────

  /me/profile:
    get:
      operationId: showProfile
      summary: Get the authenticated user's profile
      tags: [UserProfile]
      security:
        - sanctum: []
      responses:
        '200':
          description: Profile resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiResource'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      operationId: updateProfile
      summary: Update the authenticated user's profile
      tags: [UserProfile]
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
          description: |
            Weak entity tag with the expected profile version, e.g. `"v=1"`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        display_name:
                          type: string
                          maxLength: 120
                          nullable: true
                        biography:
                          type: string
                          maxLength: 2000
                          nullable: true
                        timezone:
                          type: string
                          nullable: true
      responses:
        '200':
          description: Profile updated.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiResource'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: Missing Idempotency-Key or If-Match precondition.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiError'
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiError'

  /me/username:
    post:
      operationId: assignUsername
      summary: Assign a username to the authenticated user
      tags: [UserProfile]
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [attributes]
                  properties:
                    attributes:
                      type: object
                      required: [username]
                      properties:
                        username:
                          type: string
                          minLength: 3
                          maxLength: 30
      responses:
        '201':
          description: Username assigned.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiResource'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          $ref: '#/components/responses/IdempotencyKeyRequired'
    patch:
      operationId: changeUsername
      summary: Change the authenticated user's username
      tags: [UserProfile]
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
          description: |
            Weak entity tag with the expected username version, e.g. `"v=1"`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [attributes]
                  properties:
                    attributes:
                      type: object
                      required: [username]
                      properties:
                        username:
                          type: string
                          minLength: 3
                          maxLength: 30
      responses:
        '200':
          description: Username changed.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiResource'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: Missing Idempotency-Key or If-Match precondition.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiError'
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiError'
    delete:
      operationId: removeUsername
      summary: Remove the authenticated user's username
      tags: [UserProfile]
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
          description: |
            Weak entity tag with the expected username version, e.g. `"v=1"`.
      responses:
        '204':
          description: Username removed.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          description: Missing Idempotency-Key or If-Match precondition.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiError'
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiError'

  /me/username/availability:
    get:
      operationId: checkUsernameAvailability
      summary: Check if a username is available
      tags: [UserProfile]
      security:
        - sanctum: []
      parameters:
        - in: query
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Availability result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiResource'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/phone:
    post:
      operationId: requestPhoneVerification
      summary: Request phone number verification
      description: |
        Issues a pending OTP and (when `USER_OTP_DRIVER=sms`) delivers it via the
        configured HTTP SMS gateway. Throttled per authenticated user (see `429`).
      tags: [UserProfile]
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [attributes]
                  properties:
                    attributes:
                      type: object
                      required: [phone]
                      properties:
                        phone:
                          type: string
                          description: E.164 format phone number
      responses:
        '202':
          description: Verification code sent. Empty response body.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/OtpProviderUnavailable'
        '428':
          $ref: '#/components/responses/IdempotencyKeyRequired'
    delete:
      operationId: removePhone
      summary: Remove the authenticated user's phone number
      tags: [UserProfile]
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Phone removed.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '428':
          $ref: '#/components/responses/IdempotencyKeyRequired'

  /me/phone/verify:
    post:
      operationId: verifyPhone
      summary: Verify phone number with OTP
      description: |
        Confirms the pending phone with a 6-digit OTP. Returns `410 Gone` when the OTP is
        wrong or expired, or when allowed attempts are exhausted (request a new code with `POST /me/phone`).
      tags: [UserProfile]
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [attributes]
                  properties:
                    attributes:
                      type: object
                      required: [otp]
                      properties:
                        otp:
                          type: string
                          minLength: 6
                          maxLength: 6
      responses:
        '200':
          description: Phone verified.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiResource'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '428':
          $ref: '#/components/responses/IdempotencyKeyRequired'
