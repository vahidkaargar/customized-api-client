                          completed_at: { type: string, nullable: true }
                          cancelled_at: { type: string, nullable: true }
                          reason: { type: string, nullable: true }
                          failed_at:
                            type: string
                            nullable: true
                            description: >-
                              Set when the erasure job exhausted its retries
