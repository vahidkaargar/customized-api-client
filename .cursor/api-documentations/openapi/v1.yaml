                  properties:
                    type: { type: string, enum: [locales] }
                    attributes:
                      type: object
                      required: [code, name, native_name]
                      properties:
                        code: { type: string, pattern: '^[a-z]{2}(?:_[A-Z]{2})?$' }
                        name: { type: string }
                        native_name: { type: string }
                        active: { type: boolean, default: false }
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [type, attributes]
                  properties:
                    type: { type: string, enum: [locales] }
                    attributes:
                      type: object
                      required: [code, name, native_name]
                      properties:
                        code: { type: string, pattern: '^[a-z]{2}(?:_[A-Z]{2})?$' }
