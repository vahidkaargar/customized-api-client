  # ─── Notifications ────────────────────────────────────────────────────────

  /me/notifications:
    get:
      tags: [Notifications]
      summary: Get unread notifications for authenticated user
      description: |
        Returns up to `limit` of the authenticated user's unread
        notifications (newest-first), plus the unrestricted unread
        count under `meta.unread_total` so clients can drive an
        unread badge without re-querying. Not a paginated endpoint;
        the feed is `limit`-capped, not page-paginated. For the full
        history use `GET /me/notifications/history`.
      operationId: listMeNotifications
      security:
        - sanctum: []
      responses:
        '200':
          description: |
            Capped slice of unread notifications plus the unrestricted
            unread total (`meta.unread_total`) and the cap that was
            applied (`meta.limit`).
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [type, id, attributes]
                      properties:
                        type: { type: string, enum: [notifications] }
                        id: { type: string }
                        attributes:
                          type: object
                          required: [channel, subject, body]
                          properties:
                            channel: { type: string }
                            subject: { type: string }
                            body: { type: string }
                  meta:
                    type: object
                    required: [unread_total, limit]
                    properties:
                      unread_total:
                        type: integer
                        minimum: 0
                        description: Unrestricted count of unread notifications for the authenticated user (matches `NotificationRepository::countUnread()` semantics; not capped by `limit`).
                      limit:
                        type: integer
                        minimum: 1
                        description: Cap applied to the `data` slice. Items beyond this cap are still reflected in `unread_total`.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Notifications]
      summary: Create a notification for the authenticated user
      operationId: createMeNotification
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [type, attributes]
                  properties:
                    type: { type: string, enum: [notifications] }
                    attributes:
                      type: object
                      required: [channel, subject, body]
                      properties:
                        channel: { type: string, enum: [email, sms, push, in_app] }
                        subject: { type: string, maxLength: 255 }
                        body: { type: string }
                        template_name: { type: string, maxLength: 100 }
                        variables:
                          type: object
                          additionalProperties: true
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [type, attributes]
                  properties:
                    type: { type: string, enum: [notifications] }
                    attributes:
                      type: object
                      required: [channel, subject, body]
                      properties:
                        channel: { type: string, enum: [email, sms, push, in_app] }
                        subject: { type: string, maxLength: 255 }
                        body: { type: string }
                        template_name: { type: string, maxLength: 100 }
                        variables:
                          type: object
                          additionalProperties: true
      responses:
        '201':
          description: Notification created. Returns the bare notification resource (matching the existing PATCH /me/notifications/{id}/read shape).
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [type, id, attributes]
                properties:
                  type: { type: string, enum: [notifications] }
                  id: { type: string }
                  attributes:
                    type: object
                    properties:
                      channel: { type: string, nullable: true }
                      subject: { type: string, nullable: true }
                      body: { type: string, nullable: true }
                      status: { type: string, nullable: true }
                      sent_at: { type: string, nullable: true }
                      read_at: { type: string, nullable: true }
                      failure_reason: { type: string, nullable: true }
                  links:
                    type: object
            application/json:
              schema:
                type: object
                required: [type, id, attributes]
                properties:
                  type: { type: string, enum: [notifications] }
                  id: { type: string }
                  attributes:
                    type: object
                    properties:
                      channel: { type: string, nullable: true }
                      subject: { type: string, nullable: true }
                      body: { type: string, nullable: true }
                      status: { type: string, nullable: true }
                      sent_at: { type: string, nullable: true }
                      read_at: { type: string, nullable: true }
                      failure_reason: { type: string, nullable: true }
                  links:
                    type: object
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/IdempotencyKeyRequired' }

