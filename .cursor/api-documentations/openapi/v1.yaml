      responses:
        '201':
          description: Consent recorded.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [type, id, attributes, links]
                    properties:
                      type:
                        type: string
