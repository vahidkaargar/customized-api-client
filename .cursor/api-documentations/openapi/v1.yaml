                  properties:
                    attributes:
                      type: object
                      required: [content, effective_at]
                      properties:
                        content: { type: string }
                        effective_at: { type: string, format: date-time }
      responses:
        '201':
          description: Privacy policy created.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PrivacyPolicyResource'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/IdempotencyKeyRequired' }

