            requests above the cap are rejected with `422 VALIDATION_FAILED`.
      responses:
        '200':
          description: Paginated list of data export requests for the authenticated user.
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
