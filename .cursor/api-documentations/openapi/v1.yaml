openapi: 3.0.3

info:
  title: Mobogift Public API
  description: |
    Public, versioned HTTP surface of the Mobogift platform. Every request
    and response on this contract MUST conform to JSON:API v1.1
    (https://jsonapi.org/format/1.1/) and is validated by Spectator in CI.

    Health endpoints (`/api/v1/health/live`, `/api/v1/health/ready`) are
    canonical under this contract per `.cursor/rules/api-endpoints.mdc`
    § Health Endpoints. Permanent root aliases (`/health/live`,
    `/health/ready`) remain in `routes/health.php` for ops bookmarks and
    legacy probes; they are NOT validated by this spec because they sit
    outside `config('spectator.path_prefix')`.

    ## Idempotency replay

    Every state-changing request (`POST` / `PATCH` / `PUT` / `DELETE`) MUST
    carry an `Idempotency-Key` (opaque token, ≤ 64 chars; ULIDs are
    recommended). The server stores `(actor, endpoint, key, request-hash,
    response)` for 24 hours. Within that window:

    - Duplicate request, same hash → the original response is replayed
      byte-for-byte with the additional response header
      `Idempotent-Replayed: true`.
    - Same key with a different body → `409 IDEMPOTENCY_KEY_REUSED`.
    - Same key while the original request is still in flight → `409
      IDEMPOTENCY_REQUEST_IN_PROGRESS`.
  version: 1.0.0
  contact:
    name: Mobogift Backend
    url: https://github.com/vahidkaargar/laravel-ddd-ai

servers:
  - url: /api/v1
    description: Versioned API base path (resolved against the same origin as the app; paths in this spec omit this prefix)

tags:
  - name: System
    description: Build metadata and self-description endpoints.
  - name: Auth
    description: Token issuance, revocation, registration, email verification, and password reset.
  - name: Users
    description: Authenticated user resources.
  - name: Localization
    description: Locale management and translation resources.
  - name: Audit
    description: Audit log and activity tracking endpoints.
  - name: Media
    description: Media file upload, retrieval, signed URLs, and admin operations.
  - name: Organisation
    description: Team and department management for the organisation structure.
  - name: Notifications
    description: Notification management, templates, preferences, and dispatch history.
  - name: Content
    description: Article management, announcements with audience scoping, and broadcast content.
  - name: Messaging
    description: Conversations, messages, and read receipts for direct messaging.
  - name: Analytics
    description: Metrics, dashboards, reports, and observability endpoints.
  - name: Integration
    description: Webhook subscriptions, deliveries, and partner API key management.
  - name: Privacy
    description: GDPR consent, data exports, data deletions, and privacy policies.
  - name: Admin
    description: Cross-module administrative endpoints.
  - name: Authorization
    description: Role and permission management, user-role assignment.
  - name: Security
    description: MFA enrollment, 2FA challenge verification, IP block management.
  - name: Settings
    description: Runtime configuration and dynamic feature flags.
  - name: UserProfile
    description: User profile management, username, phone verification.

components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token
    partnerApiKey:
      type: http
      scheme: bearer
      bearerFormat: Partner API key (opaque secret; bind a fixed acting user at issuance)

  headers:
    IdempotentReplayed:
      description: |
        Present (`true`) when the server replayed a previously stored response
        for a duplicate `Idempotency-Key`. Absent on the first execution. The
        response body, status code, and other headers are byte-for-byte
        identical to the original response. See § Idempotency replay in the
        top-level description for the full contract.
      schema:
        type: string
        enum: [true]
      required: false

  schemas:
    JsonApiError:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: object
            required: [status, title, detail]
            properties:
              status:
                type: string
                description: HTTP status code as a string per JSON:API v1.1.
                example: '401'
              code:
                type: string
                description: Application-specific machine-readable error code.
                example: auth.invalid_credentials
              title:
                type: string
                example: Unauthenticated
              detail:
                type: string
                example: Invalid email or password.
              source:
                type: object
                properties:
                  pointer:
                    type: string
                    example: /data/attributes/email
              meta:
                type: object
                description: |
                  JSON:API v1.1 §7.5 — open-ended map of structured,
                  machine-readable context for the error. Surfaced from
                  `DomainException::getMeta()` and sanitised by the global
                  renderer (credential / PII-shaped keys are dropped).
                  Common keys: `limit`, `current`, `window`,
                  `retry_after_seconds`, `expected_version`,
                  `current_version`, `policy_version`.

                  When a domain rate-limit exception (e.g.
                  `DataExportRateLimitExceeded`) carries
                  `retry_after_seconds`, the global renderer also lifts
                  it into the RFC 6585 / RFC 7231 §7.1.3 `Retry-After`
                  HTTP header (see the `TooManyRequests` response).
                additionalProperties: true
                example:
                  limit: 3
                  current: 3
                  window: '24h'
                  retry_after_seconds: 5400

    AuditEntryResource:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
          example: audit_entries
        id:
          type: string
          example: 01HQZX3Y4Z5A6B7C8D9E0F1G2H
        attributes:
          type: object
          properties:
            action:
              type: string
              example: auth.login_succeeded
            resource_type:
              type: string
              example: user
            resource_id:
              type: string
              nullable: true
            status:
              type: string
              example: success
            changes:
              oneOf:
                - type: 'null'
                - type: object
                  additionalProperties: true
                - type: array
            ip_address:
              type: string
              nullable: true
            user_agent:
              type: string
              nullable: true
            occurred_at:
              type: string
              format: date-time
            reason:
              type: string
              nullable: true
        links:
          type: object
          properties:
            self:
              type: string

    PrivacyPolicyResource:
      type: object
      required: [type, id, attributes, links]
      properties:
        type:
          type: string
          enum: [privacy_policies]
        id:
          type: string
          example: 01HQZX3Y4Z5A6B7C8D9E0F1G2H
        attributes:
          type: object
          required: [version, content, effective_at]
          properties:
            version: { type: integer }
            content: { type: string }
            effective_at: { type: string }
        links:
          type: object
          required: [self]
          properties:
            self:
              type: string
              example: /api/v1/privacy/policy

    TeamResource:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [teams]
        id:
          type: string
          example: 01JGXZABC1234567890ABCDEF0
        attributes:
          type: object
          properties:
            name:
              type: string
              example: Engineering
            created_at:
              type: string
              format: date-time
        relationships:
          type: object
          properties:
            owner:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type: { type: string, enum: [users] }
                    id: { type: string }
        links:
          type: object
          properties:
            self: { type: string }

    TeamMemberResource:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [members]
        id:
          type: string
        attributes:
          type: object
          properties:
            role: { type: string }
            joined_at: { type: string, nullable: true }
        relationships:
          type: object
        links:
          type: object

    DepartmentResource:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [departments]
        id:
          type: string
          example: 01JGXZABC1234567890ABCDEF0
        attributes:
          type: object
          properties:
            name:
              type: string
              example: Backend
        relationships:
          type: object
          properties:
            team:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type: { type: string, enum: [teams] }
                    id: { type: string }
            parent:
              type: object
              nullable: true
              properties:
                data:
                  type: object
                  nullable: true
                  properties:
                    type: { type: string, enum: [departments] }
                    id: { type: string }
        links:
          type: object
          properties:
            self:
              type: string

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        last_page:
          type: integer

    NeutralMessage:
      type: object
      required: [data, meta]
      properties:
        data:
          nullable: true
        meta:
          type: object
          required: [message]
          properties:
            message:
              type: string

    Version:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id, attributes]
          properties:
            type:
              type: string
              enum: [version]
            id:
              type: string
              description: Build commit SHA, or `unknown` outside CI.
            attributes:
              type: object
              required: [commit, built_at, php, env]
              properties:
                commit:
                  type: string
                built_at:
                  type: string
                php:
                  type: string
                  example: 8.5.0
                env:
                  type: string
                  example: production

    User:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id, attributes]
          properties:
            type:
              type: string
              enum: [users]
            id:
              type: string
              description: ULID identifier.
              pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
            attributes:
              type: object
              required: [email]
              properties:
                name:
                  type: string
                  nullable: true
                  description: Display name (owned by Profile, Phase 5). Null until assigned.
                email:
                  type: string
                  format: email
                email_verified_at:
                  type: string
                  format: date-time
                  nullable: true

    AdminUserListItem:
      type: object
      required: [type, id, attributes, links]
      properties:
        type:
          type: string
          enum: [users]
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        attributes:
          type: object
          required: [email, name, display_name, created_at]
          properties:
            email:
              type: string
              format: email
            name:
              type: string
              nullable: true
            display_name:
              type: string
              nullable: true
            created_at:
              type: string
              format: date-time
        links:
          type: object
          required: [self]
          properties:
            self:
              type: string

    AdminUserListCollection:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserListItem'
        meta:
          type: object
          required: [per_page, cursor]
          properties:
            per_page:
              type: integer
            cursor:
              type: object
              properties:
                next:
                  type: string
                  nullable: true
                prev:
                  type: string
                  nullable: true
        links:
          type: object
          required: [self]
          properties:
            self:
              type: string
            next:
              type: string
              nullable: true
            prev:
              type: string
              nullable: true

    ReportResourceDocument:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id, attributes, links]
          properties:
            type:
              type: string
              enum: [reports]
            id:
              type: string
              description: Report ULID.
            attributes:
              type: object
              required: [name, query, schedule, recipients]
              properties:
                name: { type: string }
                query: { type: string }
                schedule: { type: string }
                recipients:
                  type: array
                  items: { type: string }
                last_generated_at:
                  type: string
                  nullable: true
            links:
              type: object
              properties:
                self:
                  type: string
                  description: Self link for the report resource.

    AdminProfileResourceDocument:
      type: object
      required: [data]
      description: |
        Admin GET user detail returns the User module Profile aggregate as JSON:API
        (type profiles), not the Auth users envelope.
      properties:
        data:
          type: object
          required: [type, id, attributes, links]
          properties:
            type:
              type: string
              enum: [profiles]
            id:
              type: string
              description: User ULID (same as profile subject).
              pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
            attributes:
              type: object
              required: [display_name, timezone, locale]
              properties:
                display_name: { type: string }
                biography:
                  type: string
                  nullable: true
                timezone: { type: string }
                locale: { type: string }
                avatar_media_id:
                  type: string
                  nullable: true
            links:
              type: object
              properties:
                self:
                  type: string
                  description: Profile self link (may point at me/profile in current API).

    IssueTokenRequest:
      type: object
      description: |
        Multi-identifier login. Either `email` (legacy backwards-compatible) or
        `identifier` + optional `kind` must be supplied.
      anyOf:
        - required: [email, password, device_name]
          properties:
            email:
              type: string
              format: email
              maxLength: 254
            password:
              type: string
              minLength: 1
              maxLength: 1024
            device_name:
              type: string
              minLength: 1
              maxLength: 120
        - required: [identifier, password, device_name]
          properties:
            identifier:
              type: string
              minLength: 1
              maxLength: 254
              description: Email, username, or phone (E.164).
            kind:
              type: string
              enum: [email, username, phone]
              description: Optional — inferred when absent.
            password:
              type: string
              minLength: 1
              maxLength: 1024
            device_name:
              type: string
              minLength: 1
              maxLength: 120

    IssuedToken:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id, attributes, relationships]
          properties:
            type:
              type: string
              enum: [tokens]
            id:
              type: string
              description: Personal-access-token primary key.
            attributes:
              type: object
              required: [token, abilities]
              properties:
                token:
                  type: string
                  description: Plaintext token returned exactly once at issuance.
                abilities:
                  type: array
                  items:
                    type: string
                  example: ['*']
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
            relationships:
              type: object
              required: [user]
              properties:
                user:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [type, id]
                      properties:
                        type:
                          type: string
                          enum: [users]
                        id:
                          type: string
                          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'

    RegisterUserRequest:
      type: object
      required: [email, password, device_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          description: At least 12 characters; must include mixed case and at least one number.
        device_name:
          type: string
          minLength: 1
          maxLength: 120

    PasswordResetRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: Email, username, or phone (E.164).

    ConsumePasswordResetRequest:
      type: object
      required: [new_password]
      properties:
        new_password:
          type: string
          minLength: 12
          description: New password — at least 12 characters; must include mixed case and at least one number.

    PasswordResetConsumeRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes]
          properties:
            type:
              type: string
              enum: [password-reset-consumptions]
            attributes:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: Plaintext password-reset token delivered by email.
                new_password:
                  type: string
                  minLength: 12
                  description: New password — at least 12 characters; must include mixed case and at least one number.

    EmailVerificationConsumeRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes]
          properties:
            type:
              type: string
              enum: [email-verification-consumptions]
            attributes:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 512

    JsonApiCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [type, id]
            properties:
              type:
                type: string
              id:
                type: string
              attributes:
                type: object
              links:
                type: object
        meta:
          type: object
        links:
          type: object

    JsonApiResource:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
            id:
              type: string
            attributes:
              type: object
        meta:
          type: object
        links:
          type: object

    ArticleResource:
      type: object
      required: [type, id, attributes, relationships, links]
      properties:
        type:
          type: string
          example: articles
        id:
          type: string
          description: Article ULID.
        attributes:
          type: object
          properties:
            title: { type: string }
            slug: { type: string }
            excerpt: { type: string, nullable: true }
            body: { type: string, nullable: true }
            status: { type: string }
            published_at: { type: string, format: date-time, nullable: true }
            created_at: { type: string, format: date-time, nullable: true }
            version: { type: integer, nullable: true }
            tags:
              type: array
              items: { type: string }
        relationships:
          type: object
          properties:
            author:
              type: object
              properties:
                data:
                  type: object
                  required: [type, id]
                  properties:
                    type: { type: string, example: users }
                    id: { type: string, description: Author user ULID. }
        links:
          type: object
          properties:
            self:
              type: string
              format: uri

  examples:
    ArticleCollection200:
      summary: Published articles list
      value:
        data:
          - type: articles
            id: 01HWART0000000000000000001
            attributes:
              title: Published Article
              slug: published-article
              body: Body content for published article.
              status: published
              published_at: '2026-04-30T12:00:00+00:00'
              tags: []
            relationships:
              author:
                data:
                  type: users
                  id: 01HQZX3Y4Z5A6B7C8D9E0F1G2H
            links:
              self: 'http://localhost:8000/api/v1/articles/published-article'
    ArticleSingle200:
      summary: Single article by slug
      value:
        data:
          type: articles
          id: 01HWART0000000000000000001
          attributes:
            title: Published Article
            slug: published-article
            body: Body content for published article.
            status: published
            published_at: '2026-04-30T12:00:00+00:00'
            tags: []
          relationships:
            author:
              data:
                type: users
                id: 01HQZX3Y4Z5A6B7C8D9E0F1G2H
          links:
            self: 'http://localhost:8000/api/v1/articles/published-article'
    ErrorUnauthenticated401:
      summary: Missing or invalid bearer token
      value:
        errors:
          - status: '401'
            code: UNAUTHENTICATED
            title: Unauthenticated
            detail: Authentication required.
    ErrorNotFound404:
      summary: Unknown slug or ULID
      value:
        errors:
          - status: '404'
            code: RESOURCE_NOT_FOUND
            title: Resource not found
            detail: The requested resource does not exist.
    ErrorSecurityIpBlocked403:
      summary: Client IP matches an active platform IP block
      value:
        errors:
          - status: '403'
            code: SECURITY_IP_BLOCKED
            title: Forbidden
            detail: Your IP address is blocked.
    ErrorIdempotency428:
      summary: Mutating request without Idempotency-Key
      value:
        errors:
          - status: '428'
            code: IDEMPOTENCY_KEY_REQUIRED
            title: Precondition required
            detail: Idempotency-Key header is required for this request.
    ErrorPrecondition412:
      summary: Stale If-Match version
      value:
        errors:
          - status: '412'
            code: PRECONDITION_FAILED
            title: Precondition failed
            detail: Resource version does not match.
    ErrorIfMatch428:
      summary: Mutating template without If-Match
      value:
        errors:
          - status: '428'
            code: IF_MATCH_REQUIRED
            title: Precondition Required
            detail: The If-Match header is required for this request.
    ErrorMfaVerification428:
      summary: Sanctum PAT without recent MFA step-up on mfa.verified routes
      value:
        errors:
          - status: '428'
            code: MFA_VERIFICATION_REQUIRED
            title: Precondition required
            detail: Complete MFA verification for this access token before calling this endpoint.

  responses:
    Unauthenticated:
      description: Authentication credentials missing or invalid.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiError'
          examples:
            default:
              $ref: '#/components/examples/ErrorUnauthenticated401'
        application/json:
          schema:
            $ref: '#/components/schemas/JsonApiError'

    UnprocessableEntity:
      description: Validation error — JSON:API errors with /data/attributes pointers.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiError'
        application/json:
          schema:
            $ref: '#/components/schemas/JsonApiError'

    Gone:
      description: The token is invalid, expired, or already consumed.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiError'
        application/json:
          schema:
            $ref: '#/components/schemas/JsonApiError'

    OtpProviderUnavailable:
      description: |
        OTP issuance cannot complete: `USER_OTP_DRIVER` is `sms` but the SMS gateway
        returned a non-success HTTP status, the outbound HTTP call failed, or the
        SMS adapter is not fully configured (`USER_OTP_SMS_*`). Does not apply when
        `USER_OTP_DRIVER=development` (deterministic OTP for tests).
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiError'
        application/json:
          schema:
            $ref: '#/components/schemas/JsonApiError'

    TooManyRequests:
      description: |
        Rate limit hit. The response carries a `Retry-After` header per
        RFC 6585 / RFC 7231 §7.1.3 whenever the upstream throttle (Symfony
        `ThrottleRequestsException`, `TooManyRequestsHttpException`) or the
        domain `RateLimitExceeded` exception specifies a wait window. Domain
        rate-limit errors expose `errors[0].meta.retry_after_seconds` mirror
        of the same value alongside profile / context keys.
      headers:
        Retry-After:
          description: |
            Seconds the client SHOULD wait before retrying. Integer
            seconds (RFC 7231 §7.1.3 "delay-seconds" form) — never an
            HTTP-date. Absent only when neither the throttle middleware
            nor the domain exception declared a wait window.
          schema:
            type: integer
            minimum: 1
            example: 30
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiError'

    PayloadTooLarge:
      description: Request body exceeds the configured maximum for this endpoint.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiError'
        application/json:
          schema:
            $ref: '#/components/schemas/JsonApiError'

    Accepted:
      description: Request accepted. Neutral response to prevent account enumeration.
      headers:
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/NeutralMessage'
        application/json:
          schema:
            $ref: '#/components/schemas/NeutralMessage'

    Forbidden:
      description: |
        Forbidden — token lacks the required ability, policy denied the action,
        or the client IP is blocked (`SECURITY_IP_BLOCKED` from global API middleware).
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiError'
          examples:
            ability_denied:
              summary: Missing Sanctum ability
              value:
                errors:
                  - status: '403'
                    code: FORBIDDEN
                    title: Forbidden
                    detail: The request could not be completed.
            ip_blocked:
              $ref: '#/components/examples/ErrorSecurityIpBlocked403'
        application/json:
          schema:
            $ref: '#/components/schemas/JsonApiError'
          examples:
            ip_blocked:
              $ref: '#/components/examples/ErrorSecurityIpBlocked403'

    NotFound:
      description: Resource not found.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiError'
          examples:
            default:
              $ref: '#/components/examples/ErrorNotFound404'
        application/json:
          schema:
            $ref: '#/components/schemas/JsonApiError'

    Conflict:
      description: |
        Conflict — domain-level state collision OR an `Idempotency-Key` reuse
        problem detected by the request-replay middleware:
        - `IDEMPOTENCY_KEY_REUSED` — the same `Idempotency-Key` was reused on
          this endpoint with a different request body.
        - `IDEMPOTENCY_REQUEST_IN_PROGRESS` — the original request for this
          key is still being processed; retry shortly.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiError'
        application/json:
          schema:
            $ref: '#/components/schemas/JsonApiError'

    ValidationError:
      description: Validation error — JSON:API errors with /data/attributes pointers.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiError'
        application/json:
          schema:
            $ref: '#/components/schemas/JsonApiError'

    ValidationFailed:
      description: Validation failed — JSON:API errors.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiError'
        application/json:
          schema:
            $ref: '#/components/schemas/JsonApiError'

    BadRequest:
      description: Bad request.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiError'
        application/json:
          schema:
            $ref: '#/components/schemas/JsonApiError'

    IdempotencyKeyRequired:
      description: Idempotency-Key header is missing.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiError'
          examples:
            default:
              $ref: '#/components/examples/ErrorIdempotency428'
        application/json:
          schema:
            $ref: '#/components/schemas/JsonApiError'

    PreconditionFailed:
      description: If-Match optimistic concurrency failure.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiError'
          examples:
            default:
              $ref: '#/components/examples/ErrorPrecondition412'
        application/json:
          schema:
            $ref: '#/components/schemas/JsonApiError'

    IfMatchRequired:
      description: If-Match header is missing or malformed for a versioned write.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiError'
          examples:
            default:
              $ref: '#/components/examples/ErrorIfMatch428'
        application/json:
          schema:
            $ref: '#/components/schemas/JsonApiError'

    MfaVerificationRequired:
      description: |
        MFA step-up required for this Sanctum personal access token (active MFA enrollment).
        Complete `POST /me/security/mfa/challenges` and verify, or finish enrollment confirmation.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiError'
          examples:
            default:
              $ref: '#/components/examples/ErrorMfaVerification428'
        application/json:
          schema:
            $ref: '#/components/schemas/JsonApiError'

    MfaOrWritePrecondition428:
      description: |
        Preconditions not satisfied. **`428`** may be `MFA_VERIFICATION_REQUIRED` (Sanctum PAT without recent MFA step-up on `mfa.verified` routes) or `IDEMPOTENCY_KEY_REQUIRED` (mutating request without `Idempotency-Key`).
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/JsonApiError'
          examples:
            idempotencyKeyMissing:
              $ref: '#/components/examples/ErrorIdempotency428'
            mfaStepUpRequired:
              $ref: '#/components/examples/ErrorMfaVerification428'
        application/json:
          schema:
            $ref: '#/components/schemas/JsonApiError'

paths:
  /health/live:
    get:
      tags: [System]
      summary: Liveness probe.
      description: |
        Process-up probe. Returns 200 OK whenever the PHP process is
        running; never touches MySQL, Redis, or Elasticsearch. Exempt
        from `throttle:api` and unauthenticated.
      operationId: getHealthLive
      responses:
        '200':
          description: Process is alive.
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [type, id, attributes]
                    properties:
                      type:
                        type: string
                        example: health
                      id:
                        type: string
                        example: live
                      attributes:
                        type: object
                        required: [status]
                        properties:
                          status:
                            type: string
                            example: ok

  /health/ready:
    get:
      tags: [System]
      summary: Readiness probe.
      description: |
        Verifies MySQL, plus Redis when cache or session uses Redis, plus
        Elasticsearch when `FEATURE_ELASTICSEARCH_SEARCH` or
        `HEALTH_READINESS_PROBE_ELASTICSEARCH` is enabled. Returns 503 with
        a JSON:API error envelope (`code: NOT_READY`) when any required
        dependency fails its probe.
      operationId: getHealthReady
      responses:
        '200':
          description: Dependencies satisfied.
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [type, id, attributes]
                    properties:
                      type:
                        type: string
                        example: health
                      id:
                        type: string
                        example: ready
                      attributes:
                        type: object
                        required: [status]
                        properties:
                          status:
                            type: string
                            example: ok
                      meta:
                        type: object
                        properties:
                          checks:
                            type: object
                            additionalProperties:
                              type: string
        '503':
          description: One or more readiness checks failed.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiError'

  /version:
    get:
      tags: [System]
      summary: Build metadata of the running container.
      description: |
        Returns the commit SHA and build timestamp of the running image so
        deploy workflows can confirm the running container matches the
        SHA they pushed. Public and unauthenticated by design.
      operationId: getVersion
      responses:
        '200':
          description: Version envelope.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Version'

  /me:
    get:
      tags: [Users]
      summary: Return the authenticated user.
      operationId: getMe
      security:
        - sanctum: []
      responses:
        '200':
          description: Authenticated user resource.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/User'
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/tokens:
    post:
      tags: [Auth]
      summary: Issue a personal access token (login).
      description: |
        Accepts email / username / phone + password. The `email` field is
        supported for backwards compatibility and maps to `identifier` with
        `kind=email`. Returns 401 with a generic `auth.invalid_credentials`
        error for both unknown identifiers and wrong passwords.
      operationId: issueToken
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTokenRequest'
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/IssueTokenRequest'
      responses:
        '201':
          description: Token issued.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/IssuedToken'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    delete:
      tags: [Auth]
      summary: Revoke EVERY personal access token of the authenticated user.
      description: |
        Logout MUST invalidate every personal-access token owned by the
        user — not just the current one — so a leaked device cannot
        survive a manual logout (security.mdc § Token Revocation).
      operationId: revokeUserTokens
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        '204':
          description: All tokens revoked. No body.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '428':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/users:
    post:
      tags: [Auth]
      summary: Register a new user.
      description: |
        Creates a new user account. When `auth.registration.requires_email_verification`
        is `false`, returns `201` + `IssuedToken`. When verification is required,
        returns `202 Accepted` with a neutral message.
      operationId: registerUser
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '201':
          description: User registered and auto-logged in.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/IssuedToken'
        '202':
          $ref: '#/components/responses/Accepted'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/email-verifications:
    post:
      tags: [Auth]
      summary: Request an email verification token.
      description: |
        Issues a fresh single-use verification link and queues a delivery email.
        Always returns `202 Accepted` — the response is neutral whether the user is
        already verified or not (prevents user enumeration).
      operationId: requestEmailVerification
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '428':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/email-verifications/consume:
    post:
      tags: [Auth]
      summary: Consume an email verification token.
      description: |
        Marks the user's email as verified. Single-use — a second request with
        the same token returns `410 Gone`. Requires `Idempotency-Key` (ULID).
      operationId: consumeEmailVerification
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConsumeRequest'
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConsumeRequest'
      responses:
        '204':
          description: Email verified. No body.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/password-resets:
    post:
      tags: [Auth]
      summary: Request a password-reset email.
      description: |
        Issues a single-use password-reset link. Always returns `202 Accepted`
        regardless of whether the account exists — prevents account enumeration.
      operationId: requestPasswordReset
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/password-resets/consume:
    post:
      tags: [Auth]
      summary: Consume a password-reset token (canonical, body-only).
      description: |
        Verifies the plaintext token from the JSON:API request body
        (`data.type = password-reset-consumptions`,
        `data.attributes.token`, `data.attributes.new_password`), sets
        the new password, and revokes all active access tokens. Returns
        `410 Gone` for invalid, expired, or already-consumed tokens.

        Replaces the deprecated `POST /auth/password-resets/{token}`
        endpoint, which leaks the token via URL paths (logs, proxies,
        CDNs, browser history, `Referer`).
      operationId: consumePasswordResetByBody
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConsumeRequest'
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/PasswordResetConsumeRequest'
      responses:
        '204':
          description: Password updated. No body.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/password-resets/{token}:
    post:
      tags: [Auth]
      deprecated: true
      summary: Consume a password-reset token (DEPRECATED — token-in-path).
      description: |
        DEPRECATED. The plaintext reset token in the URL path leaks via
        access logs, proxies, CDN edge caches, browser history, and
        `Referer` headers. Use
        `POST /api/v1/auth/password-resets/consume` instead, which
        carries the token in the JSON:API request body.

        Every response from this endpoint includes RFC 8594
        `Deprecation: true`, `Sunset` (IMF-fixdate), and an RFC 8288
        `Link: <…>; rel="successor-version"` header. The endpoint will
        be removed on or after the `Sunset` date.
      operationId: consumePasswordReset
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumePasswordResetRequest'
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ConsumePasswordResetRequest'
      responses:
        '204':
          description: Password updated. No body.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            Deprecation:
              schema: { type: string, enum: ['true'] }
              description: RFC 8594 — deprecation marker.
            Sunset:
              schema: { type: string }
              description: RFC 8594 — IMF-fixdate after which the endpoint may be removed.
            Link:
              schema: { type: string }
              description: RFC 8288 — successor endpoint, `rel="successor-version"`.
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/IdempotencyKeyRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ── Audit / Activity Log ──────────────────────────────────────────────────

  /me/activity:
    get:
      tags: [Audit]
      summary: List my audit activity
      description: Returns a paginated list of audit entries for the authenticated user.
      operationId: listMyActivity
      security:
        - sanctum: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Paginated list of audit entries.
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AuditEntryResource' } }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /admin/audit:
    get:
      tags: [Audit]
      summary: List audit entries (admin)
      description: |
        Paginated global audit trail with optional filters. Omit filters to list all entries
        (newest first). Query parameter `categories` matches `action` exactly or as a prefix
        (`category` matches `category` or `category.*`).
      operationId: listAuditEntries
      security:
        - sanctum: []
      parameters:
        - in: query
          name: actor_id
          schema: { type: string }
        - in: query
          name: resource_type
          schema: { type: string, maxLength: 64 }
        - in: query
          name: resource_id
          schema: { type: string }
        - in: query
          name: categories
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, maxLength: 32 }
        - in: query
          name: from
          description: Inclusive lower bound (UTC), format Y-m-d\TH:i:s\Z
          schema: { type: string, format: date-time }
        - in: query
          name: to
          description: Inclusive upper bound (UTC), format Y-m-d\TH:i:s\Z
          schema: { type: string, format: date-time }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Paginated list of audit entries.
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AuditEntryResource' } }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /admin/audit/{id}:
    get:
      tags: [Audit]
      summary: Get a single audit entry (admin)
      operationId: showAuditEntry
      security:
        - sanctum: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
      responses:
        '200':
          description: The requested audit entry.
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuditEntryResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/resources/{type}/{id}/timeline:
    get:
      tags: [Audit]
      summary: Get resource timeline (admin)
      operationId: showResourceTimeline
      security:
        - sanctum: []
      parameters:
        - in: path
          name: type
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Paginated timeline of audit entries for the resource.
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AuditEntryResource' } }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /media:
    post:
      tags: [Media]
      summary: Upload a media file.
      operationId: uploadMedia
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                folder_id: { type: string }
      responses:
        '201':
          description: Media uploaded.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema: { $ref: '#/components/schemas/JsonApiResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/IdempotencyKeyRequired' }
    get:
      tags: [Media]
      summary: List authenticated user media.
      operationId: listMedia
      security:
        - sanctum: []
      responses:
        '200':
          description: Paginated list of media.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiCollection'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /media/{mediaId}:
    get:
      tags: [Media]
      summary: Retrieve a single media item.
      operationId: showMedia
      security:
        - sanctum: []
      parameters:
        - in: path
          name: mediaId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Media item.
          content:
            application/vnd.api+json:
              schema: { $ref: '#/components/schemas/JsonApiResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Media]
      summary: Soft-delete a media item.
      operationId: deleteMedia
      security:
        - sanctum: []
      parameters:
        - in: path
          name: mediaId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Media deleted.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '428': { $ref: '#/components/responses/IdempotencyKeyRequired' }

  /media/{mediaId}/signed-url:
    get:
      tags: [Media]
      summary: Get a time-limited signed URL.
      operationId: getMediaSignedUrl
      security:
        - sanctum: []
      parameters:
        - in: path
          name: mediaId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Signed URL response.
