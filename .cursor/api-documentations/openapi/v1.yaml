                      id: { type: string }
                      attributes:
                        type: object
                        properties:
                          consent_type: { type: string }
                          policy_version: { type: integer }
                          ip_address: { type: string, nullable: true }
                          consent_at: { type: string, format: date-time, nullable: true }
                          withdrawn_at: { type: string, format: date-time, nullable: true }
                      links:
                        type: object
                        properties:
                          self: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '428': { $ref: '#/components/responses/IdempotencyKeyRequired' }

