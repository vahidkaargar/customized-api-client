                          rotated: { type: boolean, enum: [true] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '428': { $ref: '#/components/responses/IdempotencyKeyRequired' }

  # ─── Inbound Webhook Receiver ────────────────────────────────────────────

  /webhooks/{provider}:
    post:
      operationId: receiveInboundWebhook
      summary: Receive an inbound webhook from an external provider
      description: |
        Secured by HMAC (`X-Webhook-Signature`, `X-Webhook-Timestamp`) and `InboundWebhookVerificationMiddleware`.
        Canonical signing string is `ts={unix}&payload={raw_body}` with signing key `SHA256(plaintext_shared_secret)`.
        Replay protection uses a synthetic dedupe key stored in `idempotency_keys` (same key shape as middleware pre-check); external providers do not send `Idempotency-Key`.
        Rate-limited per client IP and path `{provider}` (`throttle:webhooks:inbound`); request body size capped by `integration.inbound.max_body_bytes`.
      tags: [Integration]
      security: []
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string }
          description: Provider name (e.g. stripe, github)
        - in: header
          name: X-Webhook-Signature
          required: false
          schema: { type: string }
          description: |
            HMAC-SHA256 over `ts={unix}&payload={raw_body}`; wire format `sha256=<hex>`.
            Required for a successful `200`; omitting or invalid values yield `401` / `422` per handler.
        - in: header
          name: X-Webhook-Timestamp
          required: false
          schema: { type: string }
          description: |
            Unix timestamp for freshness verification.
            Required for a successful `200`; omitting yields `401`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Webhook verified and accepted (receipt envelope).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [type, attributes]
                    properties:
                      type: { type: string, enum: [webhook-receipts] }
                      attributes:
                        type: object
                        required: [status]
                        properties:
                          status: { type: string, enum: [received] }
            application/vnd.api+json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [type, attributes]
                    properties:
                      type: { type: string, enum: [webhook-receipts] }
                      attributes:
                        type: object
                        required: [status]
                        properties:
                          status: { type: string, enum: [received] }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

