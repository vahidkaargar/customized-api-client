          required: false
          schema: { type: integer, minimum: 1 }
          description: >-
            Capped at `privacy.list.max_page_size`. Defaults to
            `privacy.list.default_page_size`.
      responses:
        '200':
          description: Paginated list of pending exports older than the configured pending window.
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [type, id, attributes, links]
                      properties:
                        type:
                          type: string
                          enum: [data_exports]
                        id: { type: string }
                        attributes:
                          type: object
                          properties:
                            format: { type: string }
                            requested_at: { type: string }
                            completed_at: { type: string, nullable: true }
                            download_url: { type: string, nullable: true }
                            expires_at: { type: string, nullable: true }
                        links:
                          type: object
                          properties:
                            self: { type: string }
                            download: { type: string, nullable: true }
                  meta:
                    type: object
                    required: [total, page, per_page, last_page]
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      per_page: { type: integer }
                      last_page: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /admin/privacy/data-deletions:
    get:
      tags: [Privacy, Admin]
      summary: List all data deletion requests (admin)
      operationId: adminListDataDeletions
      security:
        - sanctum: []
      parameters:
        - in: query
          name: user_id
          schema: { type: string }
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          required: false
          schema: { type: integer, minimum: 1 }
          description: >-
            Capped at `privacy.list.max_page_size`. Defaults to
            `privacy.list.default_page_size`.
      responses:
        '200':
          description: Paginated list of data deletion requests scoped by `user_id`.
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [type, id, attributes, links]
                      properties:
