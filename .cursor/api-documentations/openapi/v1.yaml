      responses:
        '200':
          description: |
            Inbound webhook secret rotated for the named provider. The
            response is a JSON:API envelope without an `id` (the resource is
            singleton-per-provider). Mirrored byte-for-byte on idempotency
            replay.
          headers:
            Idempotent-Replayed:
