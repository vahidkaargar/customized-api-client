                        expiry_days: { type: integer, minimum: 1 }
      responses:
        '201':
          description: |
            Partner API key issued. The plaintext `key` attribute is returned
            exactly once (only on the issuance response); subsequent reads omit
            it. Mirrored byte-for-byte on idempotency replay.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema: { $ref: '#/components/schemas/JsonApiResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
