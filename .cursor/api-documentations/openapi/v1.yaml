    post:
      summary: Issue a new partner API key (plaintext returned once)
      tags: [Integration, Admin]
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type: { type: string, enum: [partner-api-keys] }
                    attributes:
                      type: object
                      required: [name, acting_user_id, abilities]
                      properties:
                        name: { type: string, maxLength: 128 }
                        acting_user_id:
                          type: string
                          minLength: 26
                          maxLength: 26
                          description: ULID of the user whose id is used as subscription owner for this key (fixed at issuance).
