  /translations/{locale}:
    get:
      tags: [Localization]
      summary: List translations for a locale
      operationId: listTranslationsForLocale
      parameters:
        - in: path
          name: locale
          required: true
          schema: { type: string, pattern: '^[a-z]{2}(?:_[A-Z]{2})?$' }
        - in: header
          name: Accept-Language
          required: false
          schema: { type: string }
          description: Optional negotiation hint for clients; the returned bundle is always keyed by the path `locale` segment (see `SetLocaleMiddleware` for app-wide locale resolution).
      responses:
        '200':
          description: Translation map for the locale.
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: { type: string } }

  /admin/locales/{locale}/import:
    post:
      tags: [Localization]
      summary: Bulk-import translations for a locale (admin).
      description: |
        Synchronous path for translation maps. Per api-bulk sizing: **N ≤ 200** keys in one request (tier ≤50 is the default “fast” band; 50 < N ≤ 200 is still synchronous with the same 201 response). **N > 200** MUST use `POST /admin/locales/{locale}/imports` (202 + operation polling). Over the sync cap returns **422** with `BULK_LIMIT_EXCEEDED`.
      operationId: adminImportTranslations
      security:
        - sanctum: []
      parameters:
        - in: path
          name: locale
          required: true
          schema: { type: string, pattern: '^[a-z]{2}(?:_[A-Z]{2})?$' }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [translations]
              properties:
                translations:
                  type: object
                  maxProperties: 200
                  description: Synchronous cap — at most 200 keys. Use `/admin/locales/{locale}/imports` when larger.
                  additionalProperties: { type: string }
                  example:
                    auth.login: Login
                    auth.logout: Logout
      responses:
        '201':
          description: Translations imported.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type: { type: string, example: translation-imports }
                      attributes:
                        type: object
                        properties:
                          locale: { type: string }
                          imported: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/IdempotencyKeyRequired' }

  /admin/locales/{locale}/imports:
    post:
      tags: [Localization]
      summary: Start an asynchronous translation import (admin).
      description: |
        For **N > 200** keys. Responds **202 Accepted** with `Location` and a `translation-import-operations` resource. Poll `GET /admin/locales/{locale}/operations/{operationId}` until `attributes.status` is `succeeded` or `failed`. Payloads with **N ≤ 200** MUST use the synchronous `POST /admin/locales/{locale}/import` endpoint instead.
      operationId: adminStartAsyncTranslationImport
      security:
        - sanctum: []
      parameters:
        - in: path
          name: locale
          required: true
          schema: { type: string, pattern: '^[a-z]{2}(?:_[A-Z]{2})?$' }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [translations]
              properties:
                translations:
                  type: object
                  minProperties: 201
                  description: More than 200 keys; processed in queued chunks of up to 200.
                  additionalProperties: { type: string }
      responses:
        '202':
          description: Import accepted; poll the operation resource.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            Location:
              schema: { type: string }
              description: URL of the translation import operation status resource.
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [type, id, attributes, links]
                    properties:
                      type: { type: string, example: translation-import-operations }
                      id: { type: string }
                      attributes:
                        type: object
                        properties:
                          locale: { type: string }
                          status: { type: string, example: queued }
                          total_keys: { type: integer }
                          processed_keys: { type: integer }
                          kind: { type: string, example: localization.translation_import }
                      links:
                        type: object
                        properties:
                          self: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/IdempotencyKeyRequired' }

  /admin/locales/{locale}/operations/{operationId}:
    get:
      tags: [Localization]
      summary: Poll a translation import operation (admin).
      operationId: adminGetTranslationImportOperation
      security:
        - sanctum: []
      parameters:
        - in: path
          name: locale
          required: true
          schema: { type: string, pattern: '^[a-z]{2}(?:_[A-Z]{2})?$' }
        - in: path
          name: operationId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Operation status.
          content:
