        '201':
          description: Locale created.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [type, id, attributes, links]
                    properties:
                      type: { type: string, enum: [locales] }
                      id: { type: string }
                      attributes:
                        type: object
                        properties:
                          code: { type: string }
                          name: { type: string }
                          native_name: { type: string }
                          active: { type: boolean }
                          created_at: { type: string, nullable: true }
                      links:
                        type: object
                        properties:
                          self: { type: string }
            application/vnd.api+json:
              schema:
                type: object
                required: [data]
