                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      per_page: { type: integer }
                      last_page: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    post:
      tags: [Privacy]
      summary: Request a data export (DSAR portability)
      operationId: requestMeDataExport
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              required: [format]
              properties:
                format: { type: string, enum: [json, csv] }
      responses:
        '202':
          description: Export request accepted and queued.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [type, id, attributes, links]
                    properties:
                      type:
                        type: string
                        enum: [data_exports]
                      id: { type: string }
                      attributes:
                        type: object
                        properties:
                          format: { type: string }
                          requested_at: { type: string, nullable: true }
                          completed_at: { type: string, nullable: true }
                          download_url: { type: string, nullable: true }
                          expires_at: { type: string, nullable: true }
                          failed_at:
                            type: string
                            nullable: true
                            description: >-
                              ISO-8601 timestamp at which the queue exhausted
                              `tries` and `markFailed(...)` was stamped onto the
                              aggregate. Non-null means the requester will not
                              receive the export and SHOULD re-request or contact
                              support.
                          last_error:
                            type: string
                            nullable: true
                            description: >-
                              Sanitised, length-capped (≤500 chars) summary of
                              why the most recent generation attempt failed.
                              Populated alongside `failed_at` once the queue
                              gives up.
                      links:
                        type: object
                        properties:
                          self: { type: string }
                          download: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '428': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/data-exports/{id}/download:
    get:
      operationId: downloadMeDataExport
      tags: [Privacy]
      summary: Download a completed DSAR export (decrypted payload)
      security:
        - sanctum: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Export request ULID
      responses:
        '200':
          description: |
            Decrypted export body streamed back to the caller. The response is
            chunked, never cached, and uses RFC 6266 + RFC 5987 filename
            encoding so the browser saves it to disk under a stable name.
          headers:
            Content-Disposition:
              description: |
                RFC 6266 attachment header. Includes both an ASCII fallback
                (`filename=`) and a UTF-8 percent-encoded form (`filename*=`).
              schema:
                type: string
              example: attachment; filename="mobogift-export-01J….json"; filename*=UTF-8''mobogift-export-01J%E2%80%A6.json
            Cache-Control:
              description: Forces clients/proxies to never cache the decrypted bytes.
              schema:
                type: string
              example: private, no-store, no-cache, must-revalidate, max-age=0
            Pragma:
              description: HTTP/1.0 no-cache fallback for ancient proxies.
              schema:
                type: string
              example: no-cache
            Expires:
              description: Always already-expired so caches treat the body as stale.
              schema:
                type: string
              example: '0'
            X-Content-Type-Options:
              description: Disables MIME sniffing on the decrypted payload.
              schema:
                type: string
              example: nosniff
            Referrer-Policy:
              description: Suppresses leaking the download URL via Referer.
              schema:
                type: string
              example: no-referrer
            X-Download-Options:
              description: Legacy IE protection — never auto-open downloads.
              schema:
                type: string
              example: noopen
            X-Frame-Options:
              description: Defense-in-depth — body must not be framed.
              schema:
                type: string
              example: DENY
          content:
            application/json:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/data-deletions:
