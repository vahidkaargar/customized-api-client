                            self: { type: string }
                  meta:
                    type: object
                    required: [total, page, per_page, last_page]
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      per_page: { type: integer }
                      last_page: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /admin/privacy/data-deletions/stuck:
    get:
      tags: [Privacy, Admin]
      summary: List "stuck" data deletion requests (admin ops view)
      description: >-
        Returns DSAR erasure requests in either of two stuck states:

        1. Terminal failed — `failed_at IS NOT NULL`. The queue worker
           exhausted its retries (Privacy dig-out L6) and surfaced the
           row via the `DeletionFailed` domain event. Needs operator
           review (manual retry, downstream investigation, or
           archive).

        2. Past-scheduled, never finished — `completed_at IS NULL AND
           cancelled_at IS NULL AND scheduled_for < (now() -
           privacy.export.pending_window_days)`. Covers both "queue
           worker never picked the job up" and "worker picked it up
           but is wedged" — neither of which the per-row terminal
           `failed()` callback catches.

        Ordered by `scheduled_for DESC` (newest stuck first per page).
        Empty result is the healthy state.
      operationId: adminListStuckDataDeletions
      security:
        - sanctum: []
      parameters:
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          required: false
          schema: { type: integer, minimum: 1 }
          description: >-
            Capped at `privacy.list.max_page_size`. Defaults to
            `privacy.list.default_page_size`.
      responses:
        '200':
          description: Paginated list of stuck deletion requests.
          content:
            application/vnd.api+json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [type, id, attributes, links]
                      properties:
                        type:
                          type: string
                          enum: [data_deletions]
                        id: { type: string }
                        attributes:
                          type: object
                          properties:
                            requested_at: { type: string }
                            scheduled_for: { type: string, nullable: true }
                            completed_at: { type: string, nullable: true }
                            cancelled_at: { type: string, nullable: true }
                            reason: { type: string, nullable: true }
                            failed_at: { type: string, nullable: true }
                            last_attempt_at: { type: string, nullable: true }
                            failed_contexts:
                              type: array
                              items: { type: string }
                        links:
                          type: object
                          properties:
                            self: { type: string }
                  meta:
                    type: object
                    required: [total, page, per_page, last_page]
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      per_page: { type: integer }
                      last_page: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /admin/privacy/policies:
