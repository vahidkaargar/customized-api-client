                  type: object
                  required: [type, attributes]
                  properties:
                    type:
                      type: string
                      enum: [reports]
                    attributes:
                      type: object
                      required: [name, query, schedule, recipients]
                      properties:
                        name: { type: string, maxLength: 255 }
                        query:
                          type: string
                          description: JSON-encoded ReportQueryDefinition payload.
                        schedule: { type: string, enum: [daily, weekly, monthly] }
                        recipients:
                          type: array
                          items: { type: string, format: email }
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [type, attributes]
                  properties:
                    type:
                      type: string
