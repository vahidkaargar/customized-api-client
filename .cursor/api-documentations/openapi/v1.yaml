  # ── Settings — Runtime Configuration & Feature Flags ─────────────────────

  /admin/settings:
    get:
      operationId: listSettings
      summary: List all settings
      description: |
        Protected by `mfa.verified`. Sanctum personal access tokens for users with **active MFA**
        must complete a recent step-up (`POST /me/security/mfa/challenges` + verify) before this call succeeds.
      tags: [Settings]
      security:
        - sanctum: []
      responses:
        '200':
          description: Collection of setting values.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiCollection'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/MfaVerificationRequired'

  /admin/settings/{scope}/{scopeId}/{key}:
    put:
      operationId: putSetting
      summary: Set a configuration value
      description: |
        The `key` MUST exist in `config('settings.registered')` and the request
        `type` MUST match the registered catalog `type`. Violations return 422
        with one of the following `errors[].code` values:

        - `SETTING_KEY_NOT_REGISTERED` — the key is not in the catalog.
        - `SETTING_TYPE_MISMATCH` — request `type` does not match catalog `type`.
      tags: [Settings]
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
        - in: path
          name: scope
          required: true
          schema:
            type: string
            enum: [system, tenant, user]
        - in: path
          name: scopeId
          required: true
          schema:
            type: string
            description: ULID for tenant/user scope, or the literal `null` for system scope.
        - in: path
          name: key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [type, attributes]
                  properties:
                    type:
                      type: string
                      enum: [settings]
                    attributes:
                      type: object
                      required: [type, value]
                      properties:
                        type:
                          type: string
                          enum: [bool, int, float, string, json]
                        value: {}
      responses:
        '200':
          description: Setting updated (minimal empty JSON object body).
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            Validation failed. `errors[].code` may be `VALIDATION_FAILED`,
            `SETTING_KEY_NOT_REGISTERED`, or `SETTING_TYPE_MISMATCH`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiError'
            application/json:
              schema:
                $ref: '#/components/schemas/JsonApiError'
        '428':
          $ref: '#/components/responses/MfaOrWritePrecondition428'
    delete:
      operationId: clearSetting
      summary: Clear a configuration value
      tags: [Settings]
      security:
        - sanctum: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
        - in: path
          name: scope
          required: true
          schema:
            type: string
            enum: [system, tenant, user]
        - in: path
          name: scopeId
          required: true
          schema:
            type: string
        - in: path
          name: key
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Setting cleared.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/MfaOrWritePrecondition428'

