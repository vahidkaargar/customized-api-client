                              attempts (e.g. `["Auth", "Notification"]`).
                              Empty in the healthy case. Privacy dig-out L6.
                      links:
                        type: object
                        properties:
                          self: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '428': { $ref: '#/components/responses/IdempotencyKeyRequired' }

