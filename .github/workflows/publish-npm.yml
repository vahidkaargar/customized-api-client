name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match CI: avoid runner Node 22.22.x toolcache + broken npm self-upgrade.
          node-version: '22.21'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@^11.5.1

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test:coverage

      - run: npm run build

      - run: npx vitest run --config vitest.postbuild.config.ts

      # Trusted Publishing (OIDC): configure on npmjs for this workflow file; provenance attaches on public repos.
      - run: npm publish --provenance
